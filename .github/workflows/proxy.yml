name: Send SOCKS5 Proxies

on:
  schedule:
    - cron: '0 */2 * * *'   # هر ۲ ساعت یک‌بار
  workflow_dispatch:         # دکمه اجرای دستی

permissions:
  contents: write            # لازم برای commit/push فایل all_proxies.txt

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run script
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python send_proxies.py
